# 放到 canzai repo 的 .github/workflows/dm_bot.yml
# 「選卡」自動回覆：每 5 分鐘（GitHub 實際常延遲到 10～15 分鐘）跑 dm_bot.py。
# 狀態 state/dm_state.enc 是加密檔（repo 公開，所以不能放明文的帳號和訊息），內容有變才 commit。
# 需要 secrets：IG_TOKEN、CANZAI_STATE_KEY。沒設定就略過。連續 3 次 API 錯誤會讓 job 失敗，GitHub 寄信通知。
name: 選卡自動回覆
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
concurrency: { group: dm-bot, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  dm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      CANZAI_STATE_KEY: ${{ secrets.CANZAI_STATE_KEY }}
    steps:
      - name: 檢查 secrets
        id: chk
        run: |
          if [ -z "$IG_TOKEN" ] || [ -z "$CANZAI_STATE_KEY" ]; then echo "還沒設定 IG_TOKEN 或 CANZAI_STATE_KEY，略過"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.skip != '1'
      - uses: actions/setup-python@v5
        if: steps.chk.outputs.skip != '1'
        with: { python-version: "3.12" }
      - if: steps.chk.outputs.skip != '1'
        run: pip install -q cryptography
      - name: 跑選卡回覆
        if: steps.chk.outputs.skip != '1'
        run: python3 程式部/comments/dm_bot.py
      - name: 存回加密狀態
        if: always() && steps.chk.outputs.skip != '1'
        run: |
          git config user.name "canzai-bot"; git config user.email "canzai-bot@users.noreply.github.com"
          git add state/dm_state.enc 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "選卡狀態 $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
